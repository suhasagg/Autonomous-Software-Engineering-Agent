services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U coder"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  java-tools:
    build: ./java-tools
    ports: ["8081:8081"]
    volumes:
      - workspaces:/workspaces

  python-agent:
    build: ./python-agent
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://coder:coder@postgres:5432/coder
      REDIS_URL: redis://redis:6379/0
      CODE_MCP_URL: http://java-tools:8081/mcp
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      java-tools:
        condition: service_started

volumes:
  workspaces:
